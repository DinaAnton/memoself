<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memoself</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A8C6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memoself">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F0E8;--su:#fff;--s2:#EDE8DF;--bo:#DDD8CE;--tx:#2A2118;--so:#9A8E7E;--ac:#7A8C6E;--di:#E4EBE0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;height:100vh}
#app{display:flex;flex-direction:column;height:100dvh;background:var(--bg)}
header{padding:16px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.cnt{flex:1;overflow-y:auto;padding-bottom:88px}
.cnt::-webkit-scrollbar{width:0}
nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--su);border-top:1px solid var(--bo);display:flex;align-items:center;padding:0 8px 8px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--so);font-size:10px;font-weight:600;cursor:pointer;padding:8px 0;border-radius:12px;font-family:inherit}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--ac);background:var(--di)}
.fab{position:fixed;bottom:82px;right:18px;width:54px;height:54px;background:var(--ac);color:#fff;border:none;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;z-index:90}
.pad{padding:0 16px}
.card{background:var(--su);border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sl{font-size:11px;font-weight:700;color:var(--so);letter-spacing:.8px;text-transform:uppercase;margin:16px 0 8px}
.fbar{display:flex;align-items:center;gap:14px;background:var(--su);border-radius:16px;padding:14px 16px;margin:0 16px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer}
.fbar img{width:68px;height:68px;object-fit:contain;flex-shrink:0}
.fname{font-size:10px;font-weight:800;color:var(--ac);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.fmsg{font-size:15px;font-style:italic}
.fmini{display:flex;align-items:center;gap:10px;margin:0 16px 14px;cursor:pointer}
.fmini img{width:36px;height:36px;object-fit:contain}
.fmini span{font-size:13px;font-style:italic;color:var(--so)}
.empty{text-align:center;padding:48px 20px;color:var(--so);font-size:14px;line-height:1.7}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:flex-end;backdrop-filter:blur(3px)}
.ov.open{display:flex}
.modal{background:var(--su);border-radius:24px 24px 0 0;padding:24px 20px 48px;width:100%;max-height:88dvh;overflow-y:auto}
.mh{width:36px;height:4px;background:var(--bo);border-radius:2px;margin:0 auto 20px}
.mt2{font-size:19px;font-weight:800;margin-bottom:20px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--so);letter-spacing:.5px;text-transform:uppercase;margin:16px 0 6px}
input[type=text],input[type=time],textarea{width:100%;padding:13px 14px;border:1.5px solid var(--bo);border-radius:12px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:none;min-height:130px}
.macts{display:flex;gap:10px;margin-top:22px}
.bp{flex:1;padding:15px;background:var(--ac);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.bs{padding:15px 18px;background:transparent;color:var(--so);border:1.5px solid var(--bo);border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.trow{display:flex;align-items:center;gap:12px;cursor:pointer}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--bo);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.done{background:var(--ac);border-color:var(--ac)}
.badge{font-size:10px;font-weight:700;background:var(--s2);color:var(--so);padding:2px 7px;border-radius:20px;display:inline-block;margin-top:3px}
.fqrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.fqrow .fqb:last-child:nth-child(5){grid-column:span 2;}
.fqb{padding:14px 8px;border:1.5px solid var(--bo);border-radius:12px;background:var(--bg);color:var(--so);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:rgba(0,0,0,0.1)}
.fqb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;gap:2px;padding:2px}
.cdnum{font-size:16px;font-weight:800;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cdprev{font-size:8px;font-weight:600;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.dpanel{background:var(--su);border-radius:16px;margin:12px 16px 0;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.dphead{padding:14px 16px 10px;font-weight:700;font-size:15px;border-bottom:1px solid var(--bo)}
.dnote{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bo)}
.dnote:last-child{border-bottom:none}
.addrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bo)}
.addrow input{flex:1;font-size:14px;padding:10px 12px}
.addbtn{padding:10px 16px;background:var(--ac);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}
.ncard{background:var(--su);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.smbtn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:none;background:var(--di);color:var(--ac);cursor:pointer;font-family:inherit}
.smbtn.g{background:transparent;color:var(--so);border:1.5px solid var(--bo)}
.msec{background:var(--su);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mrow{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--bo);cursor:pointer}
.mrow:last-child{border-bottom:none}
.micon{width:36px;height:36px;border-radius:10px;background:var(--di);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bbtn{padding:8px 14px;border:1.5px solid var(--bo);border-radius:12px;background:transparent;color:var(--so);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.larow{display:flex;gap:8px;margin-bottom:16px}
.larow input{flex:1;font-size:14px}
.larow button{padding:12px 18px;background:var(--ac);color:#fff;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer}
.lrow{display:flex;align-items:center;gap:12px}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--di);border:2px solid var(--ac);flex-shrink:0}
.brbox{background:var(--su);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.brbox textarea{border:none;background:transparent;font-size:15px;font-family:inherit;line-height:1.7;min-height:140px;width:100%;outline:none}
.brfoot{display:flex;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--bo);margin-top:8px}
.clkface{text-align:center;padding:32px 20px;background:var(--su);border-radius:16px;margin:0 16px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.clktime{font-size:52px;font-weight:800;color:var(--ac);letter-spacing:-3px;font-variant-numeric:tabular-nums}
.clksub{font-size:13px;color:var(--so);margin-top:8px;font-weight:600}
.altog{padding:6px 14px;border-radius:20px;border:2px solid var(--bo);background:transparent;color:var(--so);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.altog.on{background:var(--ac);border-color:var(--ac);color:#fff}
.hdate{font-size:11px;font-weight:700;color:var(--so);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 8px 4px}
.hitem{display:flex;align-items:center;gap:12px}
.hchk{width:22px;height:22px;border-radius:50%;background:var(--di);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.topt{border-radius:12px;overflow:hidden;border:2.5px solid transparent;cursor:pointer}
.topt.on{border-color:var(--ac)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.fcard{background:var(--s2);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.fcard.on{background:var(--di);outline:2px solid var(--ac)}
.fcard img{width:64px;height:64px;object-fit:contain}
.fnow{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;color:var(--ac);background:var(--su);padding:2px 6px;border-radius:10px}
.abanner{position:fixed;top:0;left:0;right:0;background:var(--ac);color:#fff;padding:20px 24px 16px;z-index:500;display:none;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.abanner.show{display:flex}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sbox{background:var(--s2);border-radius:12px;padding:14px;text-align:center}
.sval{font-size:26px;font-weight:800;color:var(--ac)}
.slbl{font-size:11px;color:var(--so);margin-top:2px}
.pill{background:var(--di);color:var(--ac);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div class="cnt" id="cnt"></div>
  <nav>
    <button class="nb on" id="nb-today" onclick="go('today')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/></svg>Today</button>
    <button class="nb" id="nb-calendar" onclick="go('calendar')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>Calendar</button>
    <button class="nb" id="nb-notes" onclick="go('notes')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>Notes</button>
    <button class="nb" id="nb-clock" onclick="go('clock')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>Clock</button>
    <button class="nb" id="nb-more" onclick="go('more')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>More</button>
  </nav>
  <button class="fab" onclick="handleFab()">+</button>
</div>

<div class="abanner" id="abanner" onclick="this.classList.remove('show')">
  <div style="font-size:18px;font-weight:800" id="abannerTxt">&#9200; Alarm</div>
  <div style="font-size:12px;opacity:.8">Tap to dismiss</div>
</div>

<!-- Task Modal -->
<div class="ov" id="ov-task" onclick="if(event.target===this)closeM('ov-task')">
<div class="modal">
  <div class="mh"></div><div class="mt2" id="taskModalTitle">New Task</div>
  <input type="hidden" id="taskId">
  <label class="fl">How often?</label>
  <div class="fqrow">
    <button class="fqb" id="fq-daily" onclick="setFreq('daily')">Daily</button>
    <button class="fqb on" id="fq-weekly" onclick="setFreq('weekly')">Weekly</button>
    <button class="fqb" id="fq-monthly" onclick="setFreq('monthly')">Monthly</button>
    <button class="fqb" id="fq-yearly" onclick="setFreq('yearly')">Yearly</button>
    <button class="fqb" id="fqrec" onclick="(function(){var s=document.getElementById('recrow');var on=s.style.display==='none';s.style.display=on?'block':'none';document.getElementById('fqrec').classList.toggle('on',on);if(!on){['daily','weekly','monthly','yearly'].forEach(function(x){var e=document.getElementById('fq-'+x);if(e)e.classList.remove('on');});document.getElementById('taskFreq').value='m30';}else{document.getElementById('taskFreq').value='weekly';}})()" style="grid-column:span 2">&#9201; Recurring</button>
  </div>
  <input type="hidden" id="taskFreq" value="weekly">
  <div id="recrow" style="display:none;margin-top:10px;padding:14px;background:var(--s2);border-radius:12px">
    <div style="font-size:11px;font-weight:700;color:var(--so);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">Repeat every</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">
      <button class="fqb" onclick="setRec('m1')">1 min</button>
      <button class="fqb" onclick="setRec('m5')">5 min</button>
      <button class="fqb" onclick="setRec('m10')">10 min</button>
      <button class="fqb" onclick="setRec('m15')">15 min</button>
      <button class="fqb" onclick="setRec('m20')">20 min</button>
      <button class="fqb" onclick="setRec('m30')">30 min</button>
      <button class="fqb" onclick="setRec('m45')">45 min</button>
      <button class="fqb" onclick="setRec('h1')">1 hour</button>
      <button class="fqb" onclick="setRec('h2')">2 hours</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">
      <input type="number" id="recMin" min="1" placeholder="Custom (minutes)..." style="flex:1;padding:10px 12px;border:1.5px solid var(--bo);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit;outline:none">
      <button class="fqb on" onclick="(function(){var v=parseInt(document.getElementById('recMin').value);if(v>0)setRec('m'+v);})()" style="white-space:nowrap;flex:none;padding:10px 14px">Set</button>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--so);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px">First reminder at</div>
    <input type="time" id="recTime" style="width:100%;padding:10px 12px;border:1.5px solid var(--bo);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit;outline:none">
    <div id="recSelLabel" style="font-size:12px;color:var(--ac);font-weight:600;margin-top:8px;min-height:18px"></div>
  </div>
  <label class="fl">Estimated time <span style="font-weight:400;color:var(--so)">(optional)</span></label>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px" id="estRow">
    <button class="fqb" onclick="setEst('5m')">5 min</button>
    <button class="fqb" onclick="setEst('10m')">10 min</button>
    <button class="fqb" onclick="setEst('15m')">15 min</button>
    <button class="fqb" onclick="setEst('20m')">20 min</button>
    <button class="fqb" onclick="setEst('30m')">30 min</button>
    <button class="fqb" onclick="setEst('45m')">45 min</button>
    <button class="fqb" onclick="setEst('1h')">1 hr</button>
    <button class="fqb" onclick="setEst('2h')">2 hr</button>
    <button class="fqb" onclick="setEst('3h')">3 hr</button>
    <button class="fqb" onclick="setEst('4h')">4 hr</button>
    <button class="fqb on" onclick="setEst('')" id="est-none" style="grid-column:span 2">✕ None</button>
  </div>
  <input type="hidden" id="taskEst" value="">
  <div id="estLabel" style="font-size:12px;color:var(--ac);font-weight:600;min-height:16px;margin-bottom:10px"></div>
  <label class="fl">What do you need to do?</label>
  <input type="text" id="taskName" placeholder="e.g. Back up photos" autocomplete="off" onkeydown="if(event.key==='Enter')saveTask()">
  <div class="macts">
    <button class="bs" onclick="closeM('ov-task')">Cancel</button>
    <button class="bp" onclick="saveTask()">Add Task</button>
  </div>
</div></div>

<!-- Note Modal -->
<div class="ov" id="ov-note" onclick="if(event.target===this)closeM('ov-note')">
<div class="modal">
  <div class="mh"></div><div class="mt2">Note</div>
  <input type="hidden" id="noteId">
  <label class="fl">Title</label>
  <input type="text" id="noteTitle" placeholder="e.g. Ideas for...">
  <label class="fl">Content</label>
  <textarea id="noteBody" placeholder="Write anything..."></textarea>
  <div class="macts">
    <button class="bs" onclick="closeM('ov-note')">Cancel</button>
    <button class="bp" onclick="saveNote()">Save</button>
  </div>
</div></div>

<!-- Alarm Modal -->
<div class="ov" id="ov-alarm" onclick="if(event.target===this)closeM('ov-alarm')">
<div class="modal">
  <div class="mh"></div><div class="mt2">New Alarm</div>
  <label class="fl">Time</label>
  <input type="time" id="alarmTime">
  <label class="fl">Label (optional)</label>
  <input type="text" id="alarmLabel" placeholder="e.g. Take medication">
  <label class="fl">Repeat</label>
  <div class="fqrow">
    <button class="fqb on" id="ar-once" onclick="setRepeat('once')">Once</button>
    <button class="fqb" id="ar-daily" onclick="setRepeat('daily')">Daily</button>
    <button class="fqb" id="ar-weekdays" onclick="setRepeat('weekdays')">Weekdays</button>
    <button class="fqb" id="ar-weekends" onclick="setRepeat('weekends')">Weekends</button>
  </div>
  <input type="hidden" id="alarmRepeat" value="once">
  <div class="macts">
    <button class="bs" onclick="closeM('ov-alarm')">Cancel</button>
    <button class="bp" onclick="saveAlarm()">Set Alarm</button>
  </div>
</div></div>

<!-- Foni Modal -->
<div class="ov" id="ov-foni" onclick="if(event.target===this)closeM('ov-foni')">
<div class="modal">
  <div class="mh"></div><div class="mt2">Meet Foni</div>
  <div style="font-size:13px;color:var(--so);margin-bottom:16px">Foni's mood reflects your task load.</div>
  <div class="fgrid" id="foniGrid"></div>
  <button class="bp" onclick="closeM('ov-foni')">Got it</button>
</div></div>

<!-- Theme Modal -->
<div class="ov" id="ov-theme" onclick="if(event.target===this)closeM('ov-theme')">
<div class="modal">
  <div class="mh"></div><div class="mt2">Theme</div>
  <div class="tgrid" id="themeGrid"></div>
  <button class="bp" onclick="closeM('ov-theme')">Done</button>

function applyTheme(id){

  r.setProperty('--bg',t.bg); r.setProperty('--su',t.su); r.setProperty('--s2',t.s2);

  r.setProperty('--ac',t.ac); r.setProperty('--di',t.di);
}

function pkey(freq){
  const d=new Date();
  if(freq&&freq.startsWith('h')){
    // Hourly: key is date+hour+minute of when it was last done
    // Reset happens when alarm fires (user sees it pending again after ticking)
    // Use a timestamp-based key so it's always unique per completion
    return d.toISOString().slice(0,16); // YYYY-MM-DDTHH:MM
  }
  if(freq==='daily') return d.toISOString().slice(0,10);
  if(freq==='weekly'){const j=new Date(d.getFullYear(),0,1);const w=Math.ceil(((d-j)/86400000+j.getDay()+1)/7);return d.getFullYear()+'-W'+String(w).padStart(2,'0');}
  if(freq==='monthly') return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return String(d.getFullYear());
}
const isD=t=>dlog[t.id]===pkey(t.freq);

function fst(){
  const p=tasks.filter(t=>!isD(t));
  const ov=p.filter(t=>t.created&&(Date.now()-new Date(t.created))/86400000>7);
  if(!tasks.length) return 'sleeping';
  if(!p.length) return 'happy';
  if(ov.length) return 'grumpy';
  if(p.length>=8) return 'surprised';
  if(p.length>=2) return 'thinking';
  return 'neutral';
}

function toggleHourly(){
  const sec=document.getElementById('hourly-section');
  const btn=document.getElementById('fq-hourly');
  if(!sec)return;
  const showing=sec.style.display!=='none';
  sec.style.display=showing?'none':'block';
  btn.classList.toggle('on',!showing);
  if(showing) setFreq('weekly'); // reset to weekly if hiding
}

function setCustomHours(){
  const inp=document.getElementById('customHours');
  const val=parseInt(inp?.value)||1;
  const hrs=Math.min(Math.max(val,1),23);
  setFreq('h'+hrs);
  document.getElementById('custom-hours-row').style.display='none';
}

var _actx=null;
function getACtx(){if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();if(_actx.state==='suspended')_actx.resume();return _actx;}
function playHourlyChime(){
  try{
    const ctx=getACtx();
    // Soft bell: two gentle tones
    [[392,0],[523,0.5]].forEach(([freq,delay])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      const t=ctx.createOscillator(),g2=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='triangle';o.frequency.value=freq;
      const st=ctx.currentTime+delay;
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.22,st+0.05);
      g.gain.exponentialRampToValueAtTime(0.001,st+1.0);
      o.start(st);o.stop(st+1.1);
    });
  }catch(e){}
}

function playRecChime(){
  try{
    const ctx=getACtx();
    [[392,0],[523,0.4]].forEach(function(pair){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='triangle';o.frequency.value=pair[0];
      const st=ctx.currentTime+pair[1];
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.2,st+0.05);
      g.gain.exponentialRampToValueAtTime(0.001,st+0.8);
      o.start(st);o.stop(st+0.9);
    });
  }catch(e){}
}
function playTick(){
  try{
    const ctx=getACtx();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=880;
    const t=ctx.currentTime;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.start(t);o.stop(t+0.35);
  }catch(e){console.log('tick err',e);}
}

function saveTask(){
  const id=document.getElementById('taskId').value;
  const name=document.getElementById('taskName').value.trim();
  const freq=document.getElementById('taskFreq').value||'weekly';
  const est=document.getElementById('taskEst')?document.getElementById('taskEst').value||'':'';
  if(!name)return;
  const tid=id||uid();
  if(id){tasks=tasks.map(t=>t.id===id?{...t,name,freq,est}:t);}
  else{tasks.push({id:tid,name,freq,est,created:today()});}
  S.set('tasks',tasks);
  if(freq.startsWith('m')||freq.startsWith('h')){
    const rt=document.getElementById('recTime');
    if(rt&&rt.value){
      alarms=alarms.filter(a=>a.taskId!==tid);
      alarms.push({id:uid(),time:rt.value,label:'⏱ '+name,repeat:'once',repeatLabel:'Once',active:true,taskId:tid,isRec:true});
      alarms.sort((a,b)=>a.time.localeCompare(b.time));
      S.set('alarms',alarms);
    }
  }
  closeM('ov-task');draw();
}

function toggleDone(id){
  const t=tasks.find(t=>t.id===id); if(!t)return;
  const key=pkey(t.freq);
  if(dlog[id]===key){delete dlog[id];}
  else{
    dlog[id]=key; playTick();
    dhist.unshift({taskName:t.name,freq:t.freq,completedOn:today(),
      completedAt:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});
    if(dhist.length>500)dhist.splice(500);
    S.set('dhist',dhist);
    // If hourly task: auto-set alarm for X hours later
    if(t.freq&&(t.freq.startsWith('h')||t.freq.startsWith('m'))){
      const isMin=t.freq.startsWith('m');
      const num=parseInt(t.freq.slice(1))||1;
      const nx=new Date();
      if(isMin)nx.setMinutes(nx.getMinutes()+num);
      else nx.setHours(nx.getHours()+num);
      const hh=String(nx.getHours()).padStart(2,'0');
      const mm2=String(nx.getMinutes()).padStart(2,'0');
      const nextTime=hh+':'+mm2;
      // Remove previous auto-alarm for this task if any
      alarms=alarms.filter(a=>a.taskId!==id);
      alarms.push({id:uid(),time:nextTime,label:'⏱ '+t.name,repeat:'once',repeatLabel:'Once',active:true,taskId:id,isHourly:true});
      alarms.sort((a,b)=>a.time.localeCompare(b.time));
      S.set('alarms',alarms);
      // Show toast
      const toast=document.createElement('div');
      toast.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:400;pointer-events:none;white-space:nowrap';
      toast.textContent='Next reminder at '+nextTime;
      document.body.appendChild(toast);
      setTimeout(()=>toast.remove(),2500);
    }
  }
  S.set('dlog',dlog); draw();
}

function startClock(){
  if(ctmr)clearInterval(ctmr);
  ctmr=setInterval(()=>{
    const now=new Date();
    const h=String(now.getHours()).padStart(2,'0');
    const m=String(now.getMinutes()).padStart(2,'0');
    const s=String(now.getSeconds()).padStart(2,'0');
    // Update clock display only if visible
    const el=document.getElementById('clkFace');
    if(el) el.textContent=h+':'+m+':'+s;
    // Check alarms ALWAYS, not just when clock tab is open
    if(now.getSeconds()===0){
      const hm=h+':'+m;
      if(hm!==lamin){lamin=hm;
        alarms.forEach(a=>{
          if(!a.active||a.time!==hm)return;
          const day=now.getDay();
          if(a.repeat==='once'||a.repeat==='daily'||
            (a.repeat==='weekdays'&&day>=1&&day<=5)||
            (a.repeat==='weekends'&&(day===0||day===6))){
            try{
              if(a.isHourly){playHourlyChime();}
              else{const ctx=getACtx();
              [523,659,784,1047].forEach((f,i)=>{
                const o=ctx.createOscillator(),g=ctx.createGain();
                o.connect(g);g.connect(ctx.destination);
                o.type='sine';o.frequency.value=f;
                const t=ctx.currentTime+i*0.38;
                g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.28,t+0.06);
                g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
                o.start(t);o.stop(t+0.8);
              });
              }
            }catch(e){}
            document.getElementById('abannerTxt').textContent='\u23F0 '+a.label;
            document.getElementById('abanner').classList.add('show');
            setTimeout(()=>document.getElementById('abanner').classList.remove('show'),10000);
          }
        });
      }
    }
  },1000);
}

        if(d.brain){brain=d.brain;S.set('brain',brain);}
        if(d.alarms){alarms=d.alarms;S.set('alarms',alarms);}
        draw();
        const toast=document.createElement('div');
        toast.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:400;pointer-events:none';

        document.body.appendChild(toast);

      }catch(err){alert('Invalid JSON file');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

  const cancel=document.createElement('button');
  cancel.textContent='Cancel';
  cancel.style.cssText='width:100%;margin-top:12px;padding:14px;border:1.5px solid var(--bo);border-radius:12px;background:transparent;color:var(--so);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit';
  cancel.onclick=()=>ov.remove();
  box.appendChild(cancel);
}

function clearAllData(){
  if(!confirm('Delete ALL data and start fresh?')) return;
  ['tasks','dlog','dhist','calN','notes','later','brain','alarms'].forEach(k=>localStorage.removeItem('ms9_'+k));
  tasks=[];dlog={};dhist=[];calN={};notes=[];later=[];brain=[];alarms=[];

}

  // Header

      +'<div style="font-size:24px;font-weight:800;letter-spacing:-.6px">'+now.getDate()+' '+MON[now.getMonth()]+'</div></div>'
      +(pen>0?'<div class="pill">'+pen+' pending</div>':'')

  let h='';

    var gr={daily:[],weekly:[],monthly:[],yearly:[],rec:[]};

        +'<div class="mrow" onclick="mv=\'brain\';draw()"><div class="micon">&#129504;</div><div style="flex:1"><div style="font-size:15px;font-weight:600">Brain Dump</div><div style="font-size:12px;color:var(--so)">Your thoughts, sorted here</div></div><span style="color:var(--so);font-size:18px">&#8250;</span></div>'

    }

      h+='</div>';
    }
    else if(mv==='brain'){
      h+='<div class="pad">'
        +'<div class="brow"><button class="bbtn" onclick="mv=\'main\';draw()">&#8592; Back</button><span style="font-size:18px;font-weight:800">Brain Dump</span></div>'

        });
      });
      h+='</div>';
    }
  }

  document.getElementById('cnt').innerHTML=h;
  var recContainer=document.getElementById('recCards');
  if(recContainer&&typeof gr!=='undefined'&&gr.rec){gr.rec.forEach(function(t){recContainer.appendChild(renderRecCard(t));});}
  // Append hourly task cards

  // Hide FAB when calendar day is selected (avoid double + confusion)
  document.querySelector('.fab').style.display=(tab==='calendar'&&calSel)?'none':'flex';

  // ── ATTACH EVENTS after DOM update ──

  // Calendar: attach to input and button directly (not via onclick in HTML string)
  if(tab==='calendar' && calSel){
    const inp=document.getElementById('calInp');
    const btn=document.getElementById('calAddBtn');
    if(inp){
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calAdd();}});
    }
    if(btn){
      btn.addEventListener('click',calAdd);
    }
  }

  // Later: attach input enter
  if(tab==='more' && mv==='later'){
    const inp=document.getElementById('latInp');
    if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')addLater();});
  }

  // Notes: attach button clicks via delegation (once only)
  if(tab==='notes'){
  }
}


// Single global listener for notes buttons - never duplicated
var _nBusy=false;
document.getElementById('cnt').addEventListener('click',function(e){
  if(tab!=='notes') return;
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  e.stopPropagation();
  e.preventDefault();
  if(_nBusy) return;
  _nBusy=true;
  setTimeout(function(){_nBusy=false;},600);
  const id=btn.dataset.id;
  const action=btn.dataset.action;
  if(action==='task') noteToTask(id);
  else if(action==='edit') editNote(id);
  else if(action==='del') deleteNote(id);
});

applyTheme(theme);
startClock();
draw();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
